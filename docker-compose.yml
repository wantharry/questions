services:
  # Ollama service for LLM inference (optional - can use host Ollama instead)
  ollama:
    image: ollama/ollama:latest
    container_name: questionsapp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - questionsapp-network
    profiles:
      - with-ollama  # Optional service - enable with --profile with-ollama

  # Backend FastAPI server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: questionsapp-backend
    ports:
      - "8601:8601"
    environment:
      # Use host Ollama by default, or containerized Ollama if enabled
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cpu}
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8601
      - VECTOR_STORE_TYPE=faiss
      - LOG_LEVEL=INFO
    volumes:
      # Mount data directories for persistence
      - ./data:/app/data
      - ./models:/app/models
      - ./backend:/app/backend
      # Cache HuggingFace models to avoid re-downloading on restart
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8601/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    networks:
      - questionsapp-network
    # Uncomment if using GPU for embeddings/reranking
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Frontend Streamlit application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: questionsapp-frontend
    ports:
      - "8602:8602"
    environment:
      - BACKEND_URL=http://backend:8601
      - STREAMLIT_SERVER_PORT=8602
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8602/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - questionsapp-network

networks:
  questionsapp-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  hf_cache:
    driver: local
